{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · Caminos del Bienestar (General San Martín)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos Caminos del Bienestar -->
    <link rel="stylesheet" href="{% static 'catalogo/css/styles.css' %}">
</head>
<body>

    <!-- Fondo de Ondas Suaves Verdes y Celestes -->
    <div class="waves-background" aria-hidden="true">
        <svg class="wave-top" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#A8E6CF" stop-opacity="0.55" />
                    <stop offset="50%" stop-color="#76B89D" stop-opacity="0.30" />
                    <stop offset="100%" stop-color="#89CFF0" stop-opacity="0.55" />
                </linearGradient>
            </defs>
            <path fill="url(#gradTop)" d="M0,128L60,138.7C120,149,240,171,360,160C480,149,600,107,720,106.7C840,107,960,149,1080,165.3C1200,181,1320,171,1380,165.3L1440,160L1440,0L1380,0C1320,0,1200,0,1080,0C960,0,840,0,720,0C600,0,480,0,360,0C240,0,120,0,60,0L0,0Z"></path>
        </svg>

        <svg class="wave-middle" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#89CFF0" stop-opacity="0.35" />
                    <stop offset="100%" stop-color="#A8E6CF" stop-opacity="0.40" />
                </linearGradient>
            </defs>
            <path fill="url(#gradMid)" d="M0,96L80,117.3C160,139,320,181,480,176C640,171,800,117,960,101.3C1120,85,1280,107,1360,117.3L1440,128L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
        </svg>

        <svg class="wave-bottom" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradBot" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#A8E6CF" stop-opacity="0.45" />
                    <stop offset="50%" stop-color="#5BC0BE" stop-opacity="0.30" />
                    <stop offset="100%" stop-color="#89CFF0" stop-opacity="0.48" />
                </linearGradient>
            </defs>
            <path fill="url(#gradBot)" d="M0,224L60,208C120,192,240,160,360,165.3C480,171,600,213,720,224C840,235,960,213,1080,186.7C1200,160,1320,128,1380,112L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        </svg>
    </div>

    <div class="login-viewport">
        <div class="login-glass-card">
            <div class="text-center mb-4">
                <a href="{% url 'catalogo:index' %}" class="text-decoration-none d-inline-block mb-3">
                    <span class="brand-badge" style="width:56px;height:56px;border-radius:18px;">
                        <i data-lucide="leaf" style="width:28px;height:28px;"></i>
                    </span>
                </a>
                <h1 class="h4 fw-bold mb-1">Caminos del Bienestar</h1>
                <p class="small text-secondary mb-0">
                    Espacio de Gestión del Circuito · General San Martín
                </p>
            </div>

            {% if error_msg %}
            <div class="alert alert-danger py-2 px-3 small rounded-3 border-0 mb-3 d-flex align-items-center gap-2" style="background: rgba(254, 226, 226, 0.85); color: #991B1B;">
                <i data-lucide="alert-circle" style="width:18px;height:18px;flex-shrink:0;"></i>
                <span>{{ error_msg }}</span>
            </div>
            {% endif %}

            <form method="post" action="{% url 'catalogo:gestion_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-semibold">Usuario</label>
                    <div class="position-relative">
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="form-control custom-input"
                               placeholder="Ingresá tu usuario"
                               required
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label small fw-semibold">Contraseña</label>
                    <div class="position-relative">
                        <input type="password"
                               name="password"
                               id="id_password"
                               class="form-control custom-input"
                               placeholder="••••••••••••"
                               required>
                    </div>
                </div>

                <button type="submit" class="btn-catalogo-precios py-2 mb-3">
                    <i data-lucide="sparkles" style="width:17px;height:17px;"></i>
                    Ingresar al Panel de Gestión
                </button>

                <div class="text-center">
                    <a href="{% url 'catalogo:index' %}" class="small text-decoration-none fw-semibold" style="color: var(--sage-deep);">
                        ← Volver al catálogo público
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
